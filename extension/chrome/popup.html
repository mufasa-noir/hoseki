    <h1 class="brand">
      <span class="jp" lang="ja">ホセキ</span>
      <span class="roman">Hoseki</span>
      <span class="bar" aria-hidden="true"></span>
    </h1>
    <div id="link" class="stamp checking" role="status" aria-live="polite">
      <span id="linkText">checking…</span>
    </div>
  </header>

  <div id="site" class="site">
    <span class="dot" aria-hidden="true"></span>
    <span id="siteText">Detecting tab…</span>
  </div>

  <section class="panel">
    <div class="field first">
      <label for="daemonUrl">Daemon URL</label>
      <input id="daemonUrl" type="text" placeholder="http://127.0.0.1:8765" spellcheck="false" />
    </div>

    <div class="field">
      <label for="token">Bearer token</label>
      <div class="secret">
        <input id="token" type="password" placeholder="paste ~/.hoseki/token here" spellcheck="false" autocomplete="off" />
        <button type="button" id="toggleToken" class="ghost" aria-pressed="false" aria-label="Show token">Show</button>
      </div>
    </div>

    <div class="actions">
      <button id="save" class="primary">Save</button>
      <button id="health">Health</button>
      <button id="status">Status</button>
    </div>

    <div id="state" class="terminal" aria-live="polite">—</div>
  </section>

  <section class="panel">
    <label class="switch-row" for="autoSend">
      <span class="switch-text">
        <strong>Auto-send tool results</strong>
        <small>Sends tool_result for you. Off by default.</small>
      </span>
      <input id="autoSend" class="switch" type="checkbox" role="switch" />
    </label>

    <div id="ackBlock" hidden>
      <div class="warn">
        Automating a chat site may violate its terms of service. Enable only if
        you understand and accept that risk.
      </div>
      <label class="check" for="ack">
        <input id="ack" type="checkbox" />
        <span>I understand the risk of auto-sending.</span>
      </label>
    </div>

    <div class="inline">
      <label for="maxMessageChars">Max chars per message part</label>
      <input id="maxMessageChars" type="number" min="500" max="20000" step="100" />
    </div>
  </section>

  <footer class="foot">
  <div class="foot-row">
    <button id="copyPreamble">Copy preamble</button>
    <span id="version" class="version"></span>
  </div>
  <a class="gh-link"
     href="https://github.com/mufasa-noir/hoseki"
     target="_blank"
     rel="noopener noreferrer">
    Install Hoseki
  </a>
</footer>

  <script src="popup.js"></script>
</body>
</html>
